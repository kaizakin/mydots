# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows
    gaps_in = 2
    gaps_out = 0

    # Use master layout instead of dwindle
    layout = scrolling
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
# Use round window corners
  rounding = 4

  active_opacity = 0.97
  inactive_opacity = 0.9

  # https://wiki.hyprland.org/Configuring/Variables/#blur
  blur {
      enabled = true
      size = 5
      passes = 4 # more passes =  more smooth blur
      
      # these blur apply to windows whose opacity is < 1.
      vibrancy = 0.1396 # this gives a macos like frosted glass look to the blur.
    }
}

cursor {
    enable_hyprcursor = true
}


animations {
    enabled = true
    
    # bezier is the easing curve.
    bezier = wind, 0.05, 0.9, 0.1, 1
    bezier = winIn, 0.1, 1.05, 0.1, 1
    bezier = winOut, 0.3, -0.3, 0.1, 1
    bezier = liner, 1, 1, 1, 1
    
    # animation for windows behaviour.
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}
