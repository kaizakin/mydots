unbind r
bind r source-file ~/.tmux.conf

set -g mouse on
set -g prefix C-s # set ctrl + s as prefix

setw -g mode-keys vi
bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

# Enable extended keys for tmux
set -s extended-keys on

# Allows Shift+Enter, Ctrl+Shift+<key>, etc. to work correctly in apps
set -as terminal-features 'kitty:extkeys'

# Set the default terminal inside tmux
# This ensures applications (like Neovim) know they can use 256 colors/RGB
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"

set-option -g status-position top
set -g default-terminal "tmux-256color"

# Colors
set -g @ctp_bg "#24273a"
set -g @ctp_surface_1 "#494d64"
set -g @ctp_fg "#cad3f5"
set -g @ctp_mauve "#c6a0f6"
set -g @ctp_crust "#181926"

# Status style
set -gF status-style "bg=#{@ctp_bg},fg=#{@ctp_fg}"

# Window styles
set -gF window-status-format "#[bg=#{@ctp_surface_1},fg=#{@ctp_fg}] ##I ##T "
set -gF window-status-current-format "#[bg=#{@ctp_mauve},fg=#{@ctp_crust}] ##I ##T "

# copy text to clipboard as soon as the mouse selection stops.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Add plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_status_modules_right "all"
set -g @catppuccin_window_tabs_enabled "on"
set -g @catppuccin_status_modules_right "application cpu session uptime battery"
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on' # restore last saved tmux sessions
set -g @plugin 'nhdaly/tmux-better-mouse-mode'


# Setup Catppuccin status modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# switch windows alt+number
bind-key -n M-1 select-window -t 0
bind-key -n M-2 select-window -t 1
bind-key -n M-3 select-window -t 2
bind-key -n M-4 select-window -t 3
bind-key -n M-5 select-window -t 4
bind-key -n M-6 select-window -t 5
bind-key -n M-7 select-window -t 6
bind-key -n M-8 select-window -t 7
bind-key -n M-9 select-window -t 8

set -ga terminal-overrides ",*256col*:Tc" # If the terminal supports 256 colors, force-enable 24-bit RGB colors.

set  -s escape-time 0 # Don’t wait. If I press Esc, assume I meant it. neovim feels snapppy

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

